name: ARGOS CGV IMAX monitor

on:
  schedule:
    # 5분 간격 (GitHub 최소 단위). 혼잡 시간엔 몇 분 지연될 수 있음.
    # # KST 07:00~다음날 01:00 (UTC 22:00~16:00)에만 실행해 불필요한 새벽 실행을 줄임.
    # - cron: "*/5 0-16,21-23 * * *"
    # KST 21:00~07:00 (UTC 12:00~22:00)
    # - cron: "*/5 12-22 * * *"
    - cron: "2-59/5 12-21 * * *"
  workflow_dispatch:
    inputs:
      ping:
        description: "설정 확인 핑을 텔레그램으로 전송"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cgv-imax-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: CGV 좌석 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARGOS_PING: ${{ inputs.ping == true && '1' || '' }}
        run: python3 monitor.py

      - name: 상태 저장
        run: |
          git add -A
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "argos-bot"
            git config user.email "actions@github.com"
            git commit -m "state: 잔여석 기록 갱신"
            git pull --rebase origin main
            git push
          fi
